# Runs on every push and pull request. Without it a version tag publishes
# whatever is on that commit having run nothing: `prepublishOnly` builds, so a
# broken build fails the release, but the tests were never run in CI at all.
#
# Benchmarks are excluded by default (test/benchmarks/bench.ts): they compare
# elapsed time to fixed thresholds and fail on a busy runner, which would make
# this red for reasons that are not about the code.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - name: Types
        run: bun run ts:check
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Build and consumer tooling types
        run: bun run tooling:check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Packed imports and size budgets
        run: bun run size:check
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Vite and browser regression checks
        run: bun run consumer:check
      - name: Slider rendering and interaction checks
        run: bun run slider:check
      - name: Browser comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-comparisons
          path: |
            analysis/browser
            analysis/slider-dom
          retention-days: 7
          if-no-files-found: ignore
