# Runs on every pull request, nightly on main, and on demand. Without it a version
# tag publishes whatever is on that commit having run nothing: `prepublishOnly`
# builds, so a broken build fails the release, but the tests were never run in CI.
#
# The work is split into parallel jobs, so a run takes as long as its slowest job
# rather than the sum of every step. `check` waits for all of them and is the one
# status the main ruleset requires, so the jobs can change without touching it.
#
# No run on pushes to main: the ruleset requires a pull request that is up to date
# with main, so a merge commit's tree is the tree its pull request already tested.
# The nightly run on main is the safety net.
#
# Benchmarks are excluded by default (test/benchmarks/bench.ts): they compare
# elapsed time to fixed thresholds and fail on a busy runner, which would make
# this red for reasons that are not about the code.
name: CI

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Types, the strictness ratchets, lint and test-file naming, run side by side.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Types, ratchets, lint, test naming and test types (in parallel)
        # The step's shell stops at the first failing command (bash -e), in the
        # background shells too. `|| status=$?` keeps a failing script from ending
        # its shell before the status is written: without it a failure printed
        # none of the output below, only "exit code 1".
        run: |
          logs=$(mktemp -d)
          pids=()
          for script in ts:check lint test:naming test:types; do
            (status=0; bun run "$script" > "$logs/$script.log" 2>&1 || status=$?; echo "$status" > "$logs/$script.status") &
            pids+=($!)
          done
          wait "${pids[@]}" || true
          failed=0
          for script in ts:check lint test:naming test:types; do
            status=$(cat "$logs/$script.status" 2> /dev/null || echo "not recorded")
            echo "::group::$script (exit $status)"
            cat "$logs/$script.log" || true
            echo "::endgroup::"
            [ "$status" = 0 ] || { echo "::error::$script failed"; failed=1; }
          done
          exit $failed

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun test

  # The build alone, so the jobs that read dist/ start as soon as it exists.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # The checks that read the built package, on the build's dist/.
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Element CSS files and exports
        run: bun run elements-css:check
      - name: Build and consumer tooling types
        run: bun run tooling:check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Component classes match the stylesheets
        run: bun run classes:check
      - name: Packed SSR on Node and Bun, and browser isolation
        run: bun run ssr-consumer:check
      - name: Packed imports and size budgets
        run: bun run size:check
      - name: Per-component gzip budgets
        run: bun run size
      - name: One adapter component ships only its element
        run: bun run adapters:size

  # The browser checks, in groups that run side by side, on the build's dist/.
  # A run takes as long as its slowest group, so a check that grows moves to a
  # group of its own rather than making one group longer. Every check is in
  # exactly one group; test/build/ci-commands.test.ts holds the list.
  browser:
    needs: build
    runs-on: ubuntu-latest
    # A group takes about four minutes. A runner that stalls fails here, and is
    # run again, instead of holding the pull request for most of an hour.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: elements
            browsers: chromium
            checks: elements:check shadow-styles:check
          - group: adapters
            browsers: chromium
            checks: react:check react-ssr:check vue:check svelte:check svelte-ssr:check vue-ssr:check solid-ssr:check solid:check
          - group: components
            browsers: chromium
            checks: consumer:check tabs:check slider:check drawer:check navigation-bar:check navigation-rail:check core:check
          - group: styles
            browsers: chromium
            checks: preupgrade:check tokens:check
          - group: ssr
            browsers: chromium firefox webkit
            checks: ssr:check
    name: browser (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/browsers
        with:
          browsers: ${{ matrix.browsers }}
      - name: Checks (${{ matrix.checks }})
        run: |
          for script in ${{ matrix.checks }}; do
            echo "::group::$script"
            bun run "$script" || { echo "::endgroup::"; echo "::error::$script failed"; exit 1; }
            echo "::endgroup::"
          done
      - name: Solid SSR at the peer floor (1.8.0)
        if: matrix.group == 'adapters'
        run: |
          bun add --no-save --ignore-scripts solid-js@1.8.0
          bun run solid-ssr:check
      - name: Vue SSR at the peer floor (3.3.0)
        if: matrix.group == 'adapters'
        run: |
          bun add --no-save --ignore-scripts vue@3.3.0 @vue/server-renderer@3.3.0
          bun run vue-ssr:check
      - name: Browser comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-comparisons-${{ matrix.group }}
          path: |
            analysis/browser
            analysis/slider-dom
            analysis/drawer
            analysis/navigation-rail
            analysis/core
            analysis/ssr-parity-chromium.json
            analysis/ssr-upgrade
            analysis/react-ssr/summary.json
            analysis/svelte-ssr/summary.json
            analysis/vue-ssr/summary.json
            analysis/solid-ssr/summary.json
            analysis/solid-ssr/async-*.json
          retention-days: 7
          if-no-files-found: ignore

  # The status the main ruleset requires: green only when every job above is.
  check:
    if: always()
    needs: [static, tests, build, package, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo 'static=${{ needs.static.result }} tests=${{ needs.tests.result }} build=${{ needs.build.result }} package=${{ needs.package.result }} browser=${{ needs.browser.result }}'
          [ '${{ needs.static.result }}' = success ] && [ '${{ needs.tests.result }}' = success ] \
            && [ '${{ needs.build.result }}' = success ] && [ '${{ needs.package.result }}' = success ] \
            && [ '${{ needs.browser.result }}' = success ]
